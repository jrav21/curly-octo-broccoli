function cutUpdate(dt){
  var c=CUT;if(!c)return;c.t+=dt;
  if((keys.Space||keys.Enter||att)&&c.t>.5){c.skip+=dt;if(c.skip>.45){cutSkip();return;}}else c.skip=0;
  while(c.i<c.ev.length&&c.ev[c.i].t<=c.t)cutEv(c.ev[c.i++].a);
  if(c.fadeDur>0){var kf=Math.min(1,(c.t-c.fadeT0)/c.fadeDur);c.black=c.fadeFrom+(c.fadeTo-c.fadeFrom)*kf;}
  $('fade').style.opacity=c.black;
  if(c.subT>0){c.subT-=dt;if(c.subT<=0)$('sub').innerHTML='';}
  if(c.voice&&c.voice.talk>0){c.vt-=dt;if(c.vt<=0){c.vt=.09+Math.random()*.05;snd(150+Math.random()*80+(c.voice.pitch||0),.05,'triangle',.025);}}

  labUpdate(dt);
  if(c.t>=c.len)cutEnd();
}
function cutSkip(){var c=CUT;if(!c)return;c.skipping=true;while(c.i<c.ev.length){var e=c.ev[c.i++];if(e.a[0]==='npc'||e.a[0]==='fx')cutEv(e.a);}cutEnd();}
function cutCam(dt){var c=CUT,cm=c.cam,k=cm.dur>0?Math.min(1,(c.t-cm.t0)/cm.dur):0;k=k*k*(3-2*k);

  C.position.set(p[0]+sh*.1,p[1]+sh*.08,p[2]);C.lookAt(l[0],l[1]+sh*.06,l[2]);C.fov+=(c.fov-C.fov)*Math.min(1,dt*4);C.updateProjectionMatrix();}
function cutEnd(){var c=CUT;if(!c)return;CUT=null;$('sub').innerHTML='';$('fade').style.opacity=0;document.body.classList.remove('cut');

var PERKS=[['Heavier bat: +30% melee damage',function(){pl.bat*=1.3;}],['Hollow points: +25% pistol damage',function(){pl.gun*=1.25;}],['Tougher: +20 max health and a heal',function(){pl.max+=20;pl.hp=Math.min(pl.max,pl.hp+30);}],['Light boots: +8% speed',function(){pl.spd*=1.08;}],['Second wind: faster stamina',function(){pl.regen+=8;}]];

// ---------- update ----------
function update(dt){
  var f={x:-Math.sin(yaw),z:-Math.cos(yaw)},r={x:Math.cos(yaw),z:-Math.sin(yaw)};
  var fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-tj.y,rt=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+tj.x;
  var ln=Math.hypot(fw,rt);if(ln>1){fw/=ln;rt/=ln;}
  var mx=f.x*fw+r.x*rt,mz=f.z*fw+r.z*rt,moving=ln>.1;
  var run=(keys.ShiftLeft||keys.ShiftRight||tsp)&&moving&&pl.st>0&&!pl.tired;
  if(run)pl.st=Math.max(0,pl.st-(pl.boost>0?0:26)*dt);else pl.st=Math.min(100,pl.st+pl.regen*dt);
  if(pl.st<=0)pl.tired=true;if(pl.tired&&pl.st>25)pl.tired=false;
  var sp=(run?8.6:5)*pl.spd*(pl.sw>=0?.55:1)*(pl.boost>0?1.25:1);
  if(pl.drive)driveUpdate(dt);else footPhys(dt,mx,mz,moving,sp);
  pl.inv-=dt;pl.cd-=dt;pl.shT-=dt;tracT-=dt;noAmmoT-=dt;
  // melee
  var want=!pl.drive&&(att||keys.KeyJ),edge=want&&!pl.pu,si=inv[sel]?inv[sel].id:'';pl.pu=want;
  if(want&&(si==='bat'||si==='axe')&&pl.sw<0&&pl.cd<=0){pl.sw=0;pl.hit=false;snd(220,.15,'sawtooth',.04,.4);}
  else if(edge&&pl.cd<=0&&si&&si!=='bat'&&si!=='axe'&&si!=='pistol')useItem(si);
  if(pl.sw>=0){pl.sw+=dt/.38;
    if(!pl.hit&&pl.sw>.4){pl.hit=true;
      zombies.forEach(function(z){if(z.st==='dead')return;var dx=z.x-pl.x,dz=z.z-pl.z,d=Math.hypot(dx,dz);
        if(d<3.1+z.sc*.4&&(d<1.3||(dx*f.x+dz*f.z)/d>.42))dmgZ(z,pl.bat*(si==='axe'?1.5:1),dx/d*(z.k==='b'?4:9),dz/d*(z.k==='b'?4:9));});
      barrels.forEach(function(b){if(b.alive&&Math.hypot(b.x-pl.x,b.z-pl.z)<2.8)boom(b);});}
    if(pl.sw>=1){pl.sw=-1;pl.cd=.12;}}
  // pistol
  if(!pl.drive&&(sht||keys.KeyF||(want&&si==='pistol'))&&has('pistol')&&pl.shT<=0){
    if(count('ammo')>0){take('ammo',1);pl.shT=.3;noise(pl.x,pl.z,45);tracT=.06;snd(110,.14,'sawtooth',.12,.3);shk=Math.max(shk,2.5);
      var ox=pl.x,oz=pl.z,best_=60,tgt=null,tb=null;
      obs.forEach(function(o){if(o.dead||o.h<pl.y+1.4)return;var t=rayBox(ox,oz,f.x,f.z,o);if(t<best_)best_=t;});
      zombies.forEach(function(z){if(z.st==='dead')return;var dx=z.x-ox,dz=z.z-oz,al=dx*f.x+dz*f.z,pe=Math.abs(dx*f.z-dz*f.x),yy=pl.y+1.65+Math.tan(pitch)*al;if(al>0&&al<best_&&pe<.6*z.sc&&yy>0&&yy<2*z.sc){best_=al;tgt=z;tb=null;}});
      barrels.forEach(function(b){if(!b.alive)return;var dx=b.x-ox,dz=b.z-oz,al=dx*f.x+dz*f.z,pe=Math.abs(dx*f.z-dz*f.x);if(al>0&&al<best_&&pe<.6){best_=al;tb=b;tgt=null;}});
      if(tgt)dmgZ(tgt,pl.gun,f.x*5,f.z*5);if(tb)boom(tb);
      var ex2=ox+f.x*best_,ez2=oz+f.z*best_,ey2=Math.max(.05,pl.y+1.65+Math.tan(pitch)*best_),sx=ox+f.x*.7+Math.cos(yaw)*.25,sy=pl.y+1.4,sz=oz+f.z*.7-Math.sin(yaw)*.25;
      tracer.position.set((sx+ex2)/2,(sy+ey2)/2,(sz+ez2)/2);tracer.scale.set(.04,.04,Math.max(.1,Math.hypot(ex2-sx,ey2-sy,ez2-sz)));tracer.lookAt(ex2,ey2,ez2);tracer.visible=true;pl.kick=1;}
    else if(noAmmoT<=0){say('Out of ammo');noAmmoT=1.2;snd(300,.05,'square',.04);}}
  if(tracT<=0)tracer.visible=false;
  // face
  var tf=pl.face;if(pl.sw>=0||pl.shT>0)tf=Math.atan2(f.x,f.z);else if(moving)tf=Math.atan2(mx,mz);
  pl.face+=wr(tf-pl.face)*Math.min(1,dt*14);
  // pickups
  var i=0;if(pl.drive)drivePrompt();else interact(dt);vehsUpdate(dt);labUpdate(dt);
  // combo
  cbT-=dt;if(cbT<=0)combo=0;
  // waves
  var alive=zombies.filter(function(z){return z.st!=='dead'&&!z.idle;}).length;
  if(mode==='story')storyUpdate(dt);else if(phase==='wave'){
    if(pend>0){spT-=dt;if(spT<=0&&alive<28){spawnZ();pend--;spT=Math.max(.35,1.2-wave*.06);}}
    else if(alive===0){phase='break';brk=6;var pr=PERKS[Math.floor(Math.random()*PERKS.length)];pr[1]();say('Wave cleared. Perk: '+pr[0]);
      restock();reseed();}
  }else if(mode==='survival'){brk-=dt;if(brk<=0)nextWave();}
  // zombies
  zombieUpdate(dt);
  zombies=zombies.filter(function(z){if(z.dt>4.5){S.remove(z.g);return false;}return true;});
  zombies.forEach(function(z){z.g.position.x=z.x;z.g.position.z=z.z;z.g.position.y=(z.y||0)-(z.st==='dead'&&z.dt>3?(z.dt-3)*.8:0);});
  for(i=gren.length-1;i>=0;i--){var g=gren[i];g.t-=dt;g.vy-=18*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.z+=g.vz*dt;
    if(g.y<.18){g.y=.18;g.vy=Math.abs(g.vy)*.35;g.vx*=.6;g.vz*=.6;}
    var gp={x:g.x,z:g.z};col(gp,.2);if(gp.x!==g.x||gp.z!==g.z){g.vx*=-.4;g.vz*=-.4;}g.x=gp.x;g.z=gp.z;g.m.position.set(g.x,g.y,g.z);
    if(g.t<=0){S.remove(g.m);gren.splice(i,1);boom({alive:true,m:{},o:{},x:g.x,z:g.z});}}
  // fx
  for(i=fx.length-1;i>=0;i--){var q=fx[i];q.l-=dt;q.m.position.x+=q.vx*dt;q.m.position.y+=q.vy*dt;q.m.position.z+=q.vz*dt;q.vy-=14*dt;
    if(q.m.position.y<.05){q.m.position.y=.05;q.vx*=.5;q.vz*=.5;q.vy=0;}if(q.l<=0){S.remove(q.m);fx.splice(i,1);}}
  for(i=ex.length-1;i>=0;i--){var e=ex[i];e.l-=dt;e.m.scale.setScalar(1+(.5-e.l)*14);e.m.material.opacity=Math.max(0,e.l*1.6);if(e.l<=0){S.remove(e.m);ex.splice(i,1);}}
  // HUD
  $('hp').style.width=100*pl.hp/pl.max+'%';$('sta').style.width=pl.st+'%';$('sta').style.opacity=pl.tired?.5:1;
  var cs=inv[sel];$('ammo').textContent=(cs?ITEMS[cs.id].n:'Empty hands')+(has('pistol')?'   Ammo '+count('ammo'):'');pl.boost=Math.max(0,(pl.boost||0)-dt);pl.kick=Math.max(0,(pl.kick||0)-dt*6);xhUpdate(dt);mmDraw();lampUpdate();
  $('wv').textContent=mode==='story'?(STEPS[ST.step]?'Chapter '+STEPS[ST.step].c:''):'Wave '+wave+(phase==='wave'?'  Left '+(pend+alive):'  Break '+Math.ceil(brk));
  $('sc').textContent='Score '+score;$('cb').textContent=combo>=3?'Combo x'+(1+Math.min(4,Math.floor(combo/3))):'';
}

// ---------- render ----------
function render(dt){
  tT+=dt;
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').classList.remove('on');}
  if(state!=='cut'){pm.position.set(pl.x,pl.y,pl.z);pm.rotation.y=pl.face;
  var run_=state==='play'&&(Math.abs(tj.x)+Math.abs(tj.y)>.1||keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight);
  var w=run_?Math.sin(pl.ph):0;
  pu.lL.rotation.x=w*.8;pu.lR.rotation.x=-w*.8;pu.kL.rotation.x=run_?Math.max(0,-Math.cos(pl.ph))*.9:0;pu.kR.rotation.x=run_?Math.max(0,Math.cos(pl.ph))*.9:0;pu.eL.rotation.x=run_?-.5:-.15;pu.eR.rotation.x=pl.sw>=0?0:(run_?-.5:-.15);
  if(pl.sw>=0){var s=Math.min(1,pl.sw),e=s<.4?-.9-(s/.4)*2.1:-3+((s-.4)/.6)*2.7;pu.aR.rotation.x=e;}else pu.aR.rotation.x=-.9+w*.2;
  pu.aL.rotation.x=pl.shT>0?-1.57:-w*.5;flash.visible=pl.shT>.24;
  pu.body.position.y=run_?Math.abs(Math.sin(pl.ph))*.08:0;
  if(state==='over'){pl.dead=Math.min(1,pl.dead+dt*2);pu.body.rotation.x=-1.5*pl.dead;}}
  lamp.position.set(pl.x,3.2,pl.z);lamp.intensity=.9+(pl.shT>.24?2:0);
  camUpdate(dt,run_);wpUpdate();if(state==='play')dlgUpdate(dt);bodyClass();
  fxUpdate(dt);
  if(comp&&SET.post){grade.uniforms.time.value=tT;comp.render();}else R.render(S,C);
}
var last=performance.now();
function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;if(state==='play'){update(dt);npcTick(dt);}else if(state==='cut'){cutUpdate(dt);npcTick(dt);}else if(state==='menu'){zombieUpdate(dt);zombies.forEach(function(z){z.g.position.set(z.x,z.y||0,z.z);});}render(dt);requestAnimationFrame(loop);}

// ---------- ui / input ----------
document.addEventListener('pointerlockchange',function(){if(!document.pointerLockElement&&state==='play'){state='pause';menuScreen('pause');}});
addEventListener('keydown',function(e){keys[e.code]=1;if(state==='load'&&loadReady&&(e.code==='Space'||e.code==='Enter')){loadReady();e.preventDefault();return;}if(state==='play'){var dg=e.code.indexOf('Digit')===0?+e.code[5]:0;if(dg>=1&&dg<=8)selSlot(dg-1);if(e.code==='KeyQ'&&!pl.drive)dropSel();if(e.code==='KeyT')toggleLight();if(e.code==='KeyH')honk();if(e.code==='KeyV'){SET.view=SET.view==='first'?'third':'first';saveSet();say(SET.view==='first'?'First person view':'Third person view');}}if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>-1)e.preventDefault();if(e.code==='KeyR'&&state==='over')menuAct('retry');});
addEventListener('keyup',function(e){keys[e.code]=0;});
addEventListener('mousemove',function(e){if(document.pointerLockElement){var sv_=SET.sens,iv_=SET.inv?-1:1;if(pl.drive){dyaw-=e.movementX*.0024*sv_;dpitch=Math.max(-.3,Math.min(.6,dpitch-e.movementY*.002*sv_*iv_));}else{yaw-=e.movementX*.0024*sv_;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.002*sv_*iv_));}}});
addEventListener('mousedown',function(e){if(!document.pointerLockElement)return;if(e.button===0)att=1;if(e.button===2)sht=1;});
addEventListener('mouseup',function(e){if(e.button===0)att=0;if(e.button===2)sht=0;});
addEventListener('contextmenu',function(e){e.preventDefault();});
function hold(id,fn){var b=$(id);b.addEventListener('pointerdown',function(e){e.preventDefault();fn(1);});['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){fn(0);});});}
hold('tA',function(v){att=v;});hold('tS',function(v){if(v&&state==='play')selSlot((sel+1)%8);});hold('tE',function(v){tE=v;});hold('tJ',function(v){tJ=v;});hold('tR',function(v){tsp=v;});
var jid=null,jo=null,lid=null,lp=null,jz=$('jz'),lz=$('lz');
jz.addEventListener('pointerdown',function(e){jid=e.pointerId;jo={x:e.clientX,y:e.clientY};jz.setPointerCapture(jid);});
jz.addEventListener('pointermove',function(e){if(e.pointerId!==jid)return;var dx=(e.clientX-jo.x)/50,dy=(e.clientY-jo.y)/50,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}tj.x=dx;tj.y=dy;});
function je(e){if(e.pointerId===jid){jid=null;tj.x=tj.y=0;}}
jz.addEventListener('pointerup',je);jz.addEventListener('pointercancel',je);
lz.addEventListener('pointerdown',function(e){lid=e.pointerId;lp={x:e.clientX,y:e.clientY};lz.setPointerCapture(lid);});
lz.addEventListener('pointermove',function(e){if(e.pointerId!==lid)return;var sv_=SET.sens,iv_=SET.inv?-1:1;if(pl.drive){dyaw-=(e.clientX-lp.x)*.006*sv_;dpitch=Math.max(-.3,Math.min(.6,dpitch-(e.clientY-lp.y)*.004*sv_*iv_));}else{yaw-=(e.clientX-lp.x)*.006*sv_;pitch=Math.max(-1.4,Math.min(1.4,pitch-(e.clientY-lp.y)*.004*sv_*iv_));}lp={x:e.clientX,y:e.clientY};});
function le(e){if(e.pointerId===lid)lid=null;}
lz.addEventListener('pointerup',le);lz.addEventListener('pointercancel',le);

$('hb').addEventListener('pointerdown',function(e){var s=e.target.closest('.sl');if(!s||state!=='play')return;var i=+s.dataset.i;if(i===sel&&inv[i]&&ITEMS[inv[i].id].k!=='w'&&ITEMS[inv[i].id].k!=='s')useItem(inv[i].id);else selSlot(i);});
addEventListener('wheel',function(e){if(state==='play')selSlot((sel+(e.deltaY>0?1:7))%8);});
$('ov').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b)menuAct(b.dataset.a);});
$('ov').addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.s)setOpt(t);});
$('ov').addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.s&&t.type!=='range')setOpt(t);});
$('tP').addEventListener('pointerdown',function(e){e.preventDefault();if(state==='play'){state='pause';menuScreen('pause');}});
$('load').addEventListener('pointerdown',function(){if(loadReady)loadReady();});$('skipb').addEventListener('pointerdown',function(e){e.preventDefault();cutSkip();});
reset();menuZombies();menuScreen('main');requestAnimationFrame(loop);
})();
</script>
